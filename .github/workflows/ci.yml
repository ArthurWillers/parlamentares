name: ci

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      review_history:
        description: Revalidar também todos os anos antigos, ignorando o prazo de 365 dias
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: financial-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pages: read
    env:
      NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test pipeline
        run: python -m unittest discover -s pipeline/tests -v

      - name: Determine whether official data must be refreshed
        id: refresh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi

          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            echo "No usable base revision; performing a full data refresh."
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$base"
          changed_paths="$(git diff --name-only "$base" "$HEAD_SHA")"
          if grep -Eq '^(pipeline/(collect\.py|http\.py|sources/|normalize/|aggregate/|validate/)|schemas/)' <<< "$changed_paths"; then
            echo "Official-data code or schemas changed; performing a full data refresh."
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only application/workflow code changed; reusing the published snapshot."
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restaurar fontes oficiais em cache
        if: steps.refresh.outputs.required == 'true'
        uses: ./.github/actions/restore-data
        with:
          prefix: dados-fontes-
          destination: .cache/pipeline
          token: ${{ github.token }}

      - name: Collect and validate official data
        if: steps.refresh.outputs.required == 'true'
        env:
          REVIEW_HISTORY: ${{ inputs.review_history || false }}
        run: |
          args=()
          if [ "$REVIEW_HISTORY" = "true" ]; then args+=(--review-history); fi
          python -m pipeline.collect "${args[@]}"

      - name: Restaurar pacote de dados normalizados
        id: snapshot
        if: steps.refresh.outputs.required == 'false'
        uses: ./.github/actions/restore-data
        with:
          prefix: dados-site-
          destination: public/data
          token: ${{ github.token }}

      - name: Restaurar do Pages quando ainda não há pacote
        if: steps.refresh.outputs.required == 'false' && steps.snapshot.outputs.found != 'true'
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python -m pipeline.restore_public --site-url "$SITE_URL"

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Test month ranges
        run: pnpm test

      - name: Typecheck
        run: pnpm run typecheck

      - name: Generate static site
        run: pnpm run generate

      - name: Preservar fontes oficiais para próximas coletas
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && steps.refresh.outputs.required == 'true'
        uses: ./.github/actions/save-data
        with:
          prefix: dados-fontes-
          source: .cache/pipeline
          token: ${{ github.token }}

      - name: Preservar dados para alterações da interface
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: ./.github/actions/save-data
        with:
          prefix: dados-site-
          source: public/data
          token: ${{ github.token }}

      - name: Preparar site para publicação
        uses: actions/upload-pages-artifact@v4
        with:
          path: .output/public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
