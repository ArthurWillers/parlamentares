name: ci

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pages: read
    env:
      NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test pipeline
        run: python -m unittest discover -s pipeline/tests -v

      - name: Determine whether official data must be refreshed
        id: refresh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi

          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            echo "No usable base revision; performing a full data refresh."
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$base"
          changed_paths="$(git diff --name-only "$base" "$HEAD_SHA")"
          if grep -Eq '^(pipeline/(collect\.py|http\.py|sources/|normalize/|aggregate/|validate/)|schemas/)' <<< "$changed_paths"; then
            echo "Official-data code or schemas changed; performing a full data refresh."
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only application/workflow code changed; reusing the published snapshot."
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect and validate official data
        if: steps.refresh.outputs.required == 'true'
        run: python -m pipeline.collect

      - name: Restore and validate the published data snapshot
        if: steps.refresh.outputs.required == 'false'
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python -m pipeline.restore_public --site-url "$SITE_URL"

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Generate static site
        run: pnpm run generate

      - name: Preparar site para publicação
        uses: actions/upload-pages-artifact@v4
        with:
          path: .output/public
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
